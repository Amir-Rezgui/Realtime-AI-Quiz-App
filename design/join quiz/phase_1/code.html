            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

            font-family: 'Manrope', sans-serif;

        h1, h2, h3, .font-headline {

<body class="bg-surface text-on-background min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#fdf3ff] dark:bg-[#1c1b1f] flex justify-between items-center w-full px-4 h-16 fixed top-0 z-50">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<img alt="User Profile" data-alt="Abstract circular user profile placeholder icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzAJH8xtfGKkaBFwldhtT4GDxE-3oP7jd9-7otO-u-VbpmtONwTPoe9JAW9oaj8BveBpcWezBHQg-1WvnvnYjs4f7D65Idwtb8T2hJnceIfhLjmyFgsv-Nm6ylXfU56FgdzWiVzQiafQW8ptrkJ74O_6OJELjdjhtrb3RmA5adhx2b5JqnAnwcW9Cdn7LspP3vCNfDQUVdjQ-YO4Vo7tOp8zmE8jVb08Jn_BYCbeLmxnIXR60679vCG5fz193NZ_u6OAzGmYR716NY"/>
</div>
<span class="text-[#6750A4] dark:text-[#d0bcff] font-['Plus_Jakarta_Sans'] font-bold text-xl tracking-tight">Kinetic Quiz</span>
</div>
<button class="text-[#6750A4] dark:text-[#d0bcff] font-['Plus_Jakarta_Sans'] font-bold text-sm px-4 py-2 rounded-full hover:bg-[#ebd4ff]/50 dark:hover:bg-[#4a4458]/50 transition-colors active:scale-95 duration-150">
            Join Code
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 pt-20 pb-24">
<div class="max-w-md w-full">
<!-- Centered Join Card -->
<div class="bg-surface-container-low rounded-xl p-8 md:p-12 shadow-[0_-4px_48px_0_rgba(56,38,76,0.06)] relative overflow-hidden">
<!-- Decorative element -->
<div class="absolute -top-12 -right-12 w-32 h-32 bg-primary-container/20 rounded-full blur-3xl"></div>
<div class="relative z-10 text-center mb-10">
<span class="inline-block px-3 py-1 bg-surface-container-highest text-primary font-bold text-[0.65rem] tracking-[0.2em] uppercase rounded-full mb-4">Ready to Play?</span>
<h1 class="text-on-background font-headline font-extrabold text-3xl leading-tight">Enter Game Code</h1>
</div>
<div class="space-y-8 relative z-10">
<!-- Input: Game Access Code -->
<div class="space-y-2">
<label class="block text-on-surface-variant font-label text-xs font-semibold ml-1 tracking-wide uppercase">Game Access Code</label>
<div class="relative group">
<input class="w-full bg-surface-container-highest border-none border-b-2 border-outline/20 focus:border-primary focus:ring-0 rounded-t-lg px-4 py-5 text-2xl font-headline font-bold tracking-[0.5em] text-center text-primary placeholder:text-outline-variant/50 transition-all" maxlength="6" placeholder="000 000" type="text"/>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-outline/20 group-focus-within:bg-primary transition-all"></div>
</div>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary text-on-primary font-headline font-bold py-5 rounded-lg flex items-center justify-center gap-3 shadow-lg shadow-primary/20 hover:bg-primary-dim active:scale-[0.98] transition-all duration-150 group">
<span>CONTINUE</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Lobby Status -->
</div>
</div>
</main>
<!-- Optional Visual Texture -->
<div class="fixed top-0 left-0 w-full h-full pointer-events-none z-[-1] opacity-40">
<div class="absolute top-[10%] left-[5%] w-96 h-96 bg-primary-container/30 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[10%] right-[5%] w-[30rem] h-[30rem] bg-secondary-container/20 rounded-full blur-[120px]"></div>
</div>
